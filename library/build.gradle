apply plugin: 'com.android.library'

android {
    namespace 'com.alamkanak.weekview'
    compileSdk 34

    defaultConfig {
        minSdk 14
        targetSdk 34
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
